<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16211d;
  --ink-soft:#2b3a34;
  --paper:#e9ece7;
  --card:#ffffff;
  --muted:#6d7d75;
  --line:#cfd6cf;
  --cap:#d63b26;
  --rest:#9aa8a0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Barlow',system-ui,sans-serif;
  font-size:16px;line-height:1.45;
  padding-bottom:calc(48px + env(safe-area-inset-bottom));
}
header{
  background:var(--ink);color:var(--paper);
  padding:calc(22px + env(safe-area-inset-top)) 20px 20px;
}
h1{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:700;font-size:34px;line-height:1;letter-spacing:-.01em;
  margin:0 0 10px;
}
.cap-note{
  display:flex;align-items:baseline;gap:9px;
  font-size:14px;color:#a9bab1;margin:0;
}
.cap-note b{
  font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;
  color:var(--cap);line-height:1;
}
nav{
  display:flex;gap:6px;padding:14px 20px 0;
  position:sticky;top:0;z-index:10;background:var(--paper);
}
nav::after{
  content:"";position:absolute;left:0;right:0;bottom:-14px;height:14px;
  background:linear-gradient(var(--paper),rgba(233,236,231,0));
}
nav button{
  flex:1;font-family:'Barlow Condensed',sans-serif;font-weight:600;
  font-size:17px;padding:9px 4px;border:1px solid var(--line);
  background:transparent;color:var(--muted);border-radius:2px;cursor:pointer;
}
nav button[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
main{padding:20px 16px 0;max-width:560px;margin:0 auto}
.day{
  display:grid;grid-template-columns:52px 1fr auto;gap:14px;
  align-items:start;background:var(--card);
  border:1px solid var(--line);border-radius:3px;
  padding:13px 14px;margin-bottom:8px;cursor:pointer;
}
.day.today{border-color:var(--ink);border-width:2px;padding:12px 13px}
.day.rest{background:transparent;border-style:dashed}
.day.done .name,.day.done .kind{text-decoration:line-through;opacity:.45}
.date{
  font-family:'Barlow Condensed',sans-serif;line-height:1;padding-top:2px;
}
.date .dow{display:block;font-size:13px;font-weight:600;color:var(--muted)}
.date .num{display:block;font-size:27px;font-weight:700;letter-spacing:-.02em}
.kind{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.name{
  font-family:'Barlow Condensed',sans-serif;font-weight:600;
  font-size:21px;line-height:1.15;margin-top:1px;
}
.loc{font-size:13px;color:var(--muted);margin-top:2px}
.cap{
  font-family:'Barlow Condensed',sans-serif;text-align:right;line-height:.95;
  border-left:2px solid var(--cap);padding-left:9px;
}
.cap .v{display:block;font-size:29px;font-weight:700;color:var(--cap)}
.cap .l{display:block;font-size:10.5px;font-weight:600;color:var(--muted)}
.det{
  grid-column:1/-1;margin:0;padding:11px 0 1px;
  border-top:1px solid var(--line);
}
.det li{font-size:14.5px;margin-bottom:5px;color:var(--ink-soft)}
.det li:last-child{margin-bottom:0}
.tick{
  grid-column:1/-1;margin-top:9px;display:flex;align-items:center;gap:8px;
  font-size:14px;color:var(--muted);
}
.tick input{width:19px;height:19px;accent-color:var(--ink)}
footer{
  max-width:560px;margin:0 auto;padding:6px 16px 30px;
  font-size:13px;color:var(--muted);
}
[hidden]{display:none !important}
@media(prefers-reduced-motion:no-preference){
  .det{animation:o .18s ease-out}
  @keyframes o{from{opacity:0}to{opacity:1}}
}
</style>
</head>
<body>
<header>
  <h1>Trainingsplan</h1>
  <p class="cap-note"><b>150</b><span>Herzfrequenz-Deckel bei jedem Lauf. Piept der Garmin, gehst du.</span></p>
</header>
<nav role="tablist">
  <button role="tab" data-w="0" aria-selected="true">Wien</button>
  <button role="tab" data-w="1" aria-selected="false">Hossegor</button>
</nav>
<main id="list"></main>
<footer id="foot"></footer>
<script>
const PLAN = [{"d": "2026-09-01", "t": "Lauf", "n": "25 min locker", "hr": 150, "loc": "Prater Hauptallee", "det": ["Flach bleiben, kein Hügel.", "HF-Alarm am Garmin auf 150. Wenn er piept: gehen, bis du unter 145 bist.", "Erwarte 6:30–7:00/km. Fühlt sich zu langsam an, ist trotzdem richtig."]}, {"d": "2026-09-02", "t": "Rad", "n": "75 min locker", "hr": 140, "loc": "Donauinsel oder Lobau", "det": ["HF unter 140 halten.", "Trittfrequenz 90 oder höher.", "Keine Segmente. Kein Sprint am Kanal."]}, {"d": "2026-09-03", "t": "Frei", "n": "Ruhetag", "hr": null, "loc": "", "det": ["Kein Sport."]}, {"d": "2026-09-04", "t": "Rad", "n": "FTP-Test", "hr": null, "loc": "Höhenstraße", "det": ["10 min locker einrollen.", "20 min am Stück gleichmäßig, Ziel etwa 235 W. Nicht vorne raushauen.", "10 min ausrollen.", "FTP = 95 % deiner 20-Minuten-Leistung.", "Vorher essen: 60 g Kohlenhydrate."]}, {"d": "2026-09-05", "t": "Reise", "n": "Flug nach Hossegor", "hr": null, "loc": "", "det": ["Kein Sport."]}, {"d": "2026-09-06", "t": "Lauf", "n": "30 min Waldweg", "hr": 150, "loc": "Kiefernwald", "det": ["Weicher Untergrund, das ist der Grund für den Wald.", "Kein tiefer Sand — Wadenkiller.", "Kein nasser Strandstreifen, der ist immer schräg."]}, {"d": "2026-09-07", "t": "Wasser", "n": "Schwimmen 20–30 min", "hr": null, "loc": "Meer", "det": ["Locker, reine Regeneration. Oder frei.", "Surfen zählt als Einheit — dann sag Bescheid."]}, {"d": "2026-09-08", "t": "Lauf", "n": "35 min Waldweg", "hr": 150, "loc": "Kiefernwald", "det": ["Vorher prüfen: Waden und Achilles nach Sonntag frei?", "Wenn nicht: kürzen oder schwimmen."]}, {"d": "2026-09-09", "t": "Kraft", "n": "30 min Ganzkörper", "hr": null, "loc": "Ohne Geräte", "det": ["Kniebeugen, Ausfallschritte, Liegestütz, Planks, Rudern mit Band.", "Fällt weg, wenn du surfen warst."]}, {"d": "2026-09-10", "t": "Lauf", "n": "40 min Waldweg", "hr": 150, "loc": "Kiefernwald", "det": ["Gleicher Deckel. Tempo egal."]}, {"d": "2026-09-11", "t": "Frei", "n": "Ruhetag", "hr": null, "loc": "", "det": ["Frei oder langer lockerer Küstenspaziergang."]}, {"d": "2026-09-12", "t": "Lauf", "n": "45 min flach", "hr": 150, "loc": "Kiefernwald", "det": ["Längster Lauf der Woche.", "Schwere Beine? Dann 30 min oder stattdessen schwimmen."]}];
const DOW = ['So','Mo','Di','Mi','Do','Fr','Sa'];
let store = {};
try { store = JSON.parse(localStorage.getItem('trainingDone') || '{}'); } catch(e) { store = {}; }
function save(){ try { localStorage.setItem('trainingDone', JSON.stringify(store)); } catch(e) {} }

const todayISO = new Date().toISOString().slice(0,10);
let week = 0, open = null;

function render(){
  const list = document.getElementById('list');
  list.innerHTML = '';
  const days = PLAN.filter(p => (p.d <= '2026-09-05' ? 0 : 1) === week);
  days.forEach(p => {
    const el = document.createElement('article');
    const dt = new Date(p.d + 'T12:00:00');
    el.className = 'day' + (p.d === todayISO ? ' today' : '')
      + (p.hr === null && (p.t === 'Frei' || p.t === 'Reise') ? ' rest' : '')
      + (store[p.d] ? ' done' : '');
    el.innerHTML =
      '<div class="date"><span class="dow">' + DOW[dt.getDay()] + '</span>'
      + '<span class="num">' + dt.getDate() + '</span></div>'
      + '<div><div class="kind">' + p.t + '</div><div class="name">' + p.n + '</div>'
      + (p.loc ? '<div class="loc">' + p.loc + '</div>' : '') + '</div>'
      + (p.hr ? '<div class="cap"><span class="v">' + p.hr + '</span><span class="l">max HF</span></div>' : '<div></div>');
    if (open === p.d) {
      const ul = document.createElement('ul');
      ul.className = 'det';
      ul.innerHTML = p.det.map(x => '<li>' + x + '</li>').join('');
      el.appendChild(ul);
      const lab = document.createElement('label');
      lab.className = 'tick';
      lab.innerHTML = '<input type="checkbox"' + (store[p.d] ? ' checked' : '') + '> erledigt';
      lab.querySelector('input').addEventListener('change', e => {
        e.stopPropagation();
        store[p.d] = e.target.checked; save(); render();
      });
      lab.addEventListener('click', e => e.stopPropagation());
      el.appendChild(lab);
    }
    el.addEventListener('click', () => { open = (open === p.d ? null : p.d); render(); });
    list.appendChild(el);
  });
  const runs = days.filter(p => p.t === 'Lauf').length;
  const done = days.filter(p => store[p.d]).length;
  document.getElementById('foot').textContent =
    days.length + ' Tage · ' + runs + ' Läufe · ' + done + ' erledigt';
}
document.querySelectorAll('nav button').forEach(b => {
  b.addEventListener('click', () => {
    week = +b.dataset.w; open = null;
    document.querySelectorAll('nav button').forEach(x =>
      x.setAttribute('aria-selected', x === b));
    render();
  });
});
if (todayISO > '2026-09-05') {
  week = 1;
  document.querySelectorAll('nav button').forEach(x =>
    x.setAttribute('aria-selected', x.dataset.w === '1'));
}
render();
</script>
</body>
</html>
