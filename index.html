<style>
:root{
  --ink:#16211d; --ink2:#2b3a34; --paper:#e9ece7; --card:#fff;
  --muted:#6d7d75; --line:#cfd6cf; --cap:#d63b26; --tint:#fbeeea;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'Barlow',system-ui,sans-serif;
  font-size:16px;line-height:1.45;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto}
header{background:var(--ink);color:var(--paper);padding:calc(20px + env(safe-area-inset-top)) 18px 16px}
header .who{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:27px;line-height:1;margin:0}
.todaybar{display:flex;align-items:center;gap:11px;margin-top:13px}
.todaybar svg{width:27px;height:27px;flex:0 0 27px;color:#cfe0d6}
.todaybar .tx{font-size:14px;color:#a9bab1;line-height:1.3}
.todaybar .tx b{display:block;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:19px;color:var(--paper)}
.bar{display:flex;align-items:center;gap:8px;padding:14px 14px 10px}
.bar h2{flex:1;margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:21px}
.nav,.seg button{border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:2px;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-weight:600}
.nav{width:32px;height:30px;font-size:17px;line-height:1}
.seg{display:flex;gap:5px;padding:0 14px 10px}
.seg button{flex:1;font-size:16px;padding:7px 0;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dows{display:grid;grid-template-columns:repeat(7,1fr);padding:0 10px;gap:3px}
.dows span{text-align:center;font-size:11.5px;font-weight:600;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:5px 10px 0}
.cell{aspect-ratio:1/1.1;border:1px solid transparent;border-radius:3px;display:flex;
  flex-direction:column;align-items:center;justify-content:flex-start;padding:3px 0 0;
  background:transparent;cursor:default;font:inherit;color:inherit}
.cell.has{background:var(--card);border-color:var(--line);cursor:pointer}
.cell.out{opacity:.28}
.cell .n{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:600;line-height:1;color:var(--muted)}
.cell svg{width:22px;height:22px;margin-top:3px;color:var(--ink);display:block}
.cell.today{border-color:var(--ink);border-width:2px;padding-top:2px}
.cell.today .n{color:var(--ink)}
.cell.sel{background:var(--ink);border-color:var(--ink)}
.cell.sel .n,.cell.sel svg{color:var(--paper)}
.cell .dot{width:5px;height:5px;border-radius:50%;background:var(--cap);margin-top:2px}
.cell.sel .dot{background:#f2a08f}
.cell.done svg{opacity:.28}
.weeklist{padding:2px 14px 0}
.item{margin-bottom:7px;border:1px solid var(--line);border-radius:3px;background:var(--card);overflow:hidden}
.item.empty{background:transparent;border-style:dashed}
.item.today{border-color:var(--ink);border-width:2px}
.item.sel{background:var(--tint);border-color:var(--cap)}
.row{display:grid;grid-template-columns:42px 26px 1fr auto;gap:11px;align-items:center;
  padding:11px 12px;cursor:pointer;background:transparent;border:0;width:100%;
  font:inherit;color:inherit;text-align:left}
.item.empty .row{cursor:default}
.row .dt{font-family:'Barlow Condensed',sans-serif;line-height:1}
.row .dt small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.row .dt strong{display:block;font-size:22px;font-weight:700}
.row svg{width:25px;height:25px;color:var(--ink);display:block}
.row .ti{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:19px;line-height:1.15}
.row .sp{font-size:12px;color:var(--muted)}
.item.done .ti{text-decoration:line-through;opacity:.45}
.hr{font-family:'Barlow Condensed',sans-serif;text-align:right;line-height:.95;
  border-left:2px solid var(--cap);padding-left:8px}
.hr .v{display:block;font-size:24px;font-weight:700;color:var(--cap)}
.hr .l{display:block;font-size:10px;font-weight:600;color:var(--muted)}
.body{padding:0 13px 12px;border-top:1px solid var(--line);margin:0 12px}
.body .capline{display:flex;align-items:baseline;gap:8px;padding:10px 0 8px}
.body .capline b{font-family:'Barlow Condensed',sans-serif;font-size:25px;font-weight:700;color:var(--cap);line-height:1}
.body .capline span{font-size:13.5px;color:var(--muted)}
.body ul{margin:10px 0 0;padding-left:17px}
.body .capline + ul{margin-top:0}
.body li{font-size:14.5px;color:var(--ink2);margin-bottom:5px}
.body li:last-child{margin-bottom:0}
.body label{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:10px;
  border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.body input{width:19px;height:19px;accent-color:var(--ink)}
.mdetail{margin:12px 14px 0}
.mdetail .item{margin:0}
.mdetail .head{display:flex;align-items:center;gap:11px;padding:13px 13px 11px}
.mdetail .head svg{width:30px;height:30px;color:var(--ink);flex:0 0 30px}
.mdetail .head h3{margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:22px;line-height:1.1}
.mdetail .head .day{font-size:13px;color:var(--muted)}
.hint{margin:14px;font-size:14px;color:var(--muted)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--cap);outline-offset:2px}
</style>
</head>

<script>
const FALLBACK = {"2026-09-01": {"sport": "lauf", "title": "25 min locker", "cap": 150, "message": "Lauf 25 min locker. HF-Deckel 150.", "notes": ["Flach bleiben, kein Hügel.", "HF-Alarm am Garmin auf 150. Wenn er piept: gehen, bis du unter 145 bist.", "Erwarte 6:30–7:00/km. Fühlt sich zu langsam an, ist trotzdem richtig."]}, "2026-09-02": {"sport": "rennrad", "title": "75 min locker", "cap": 140, "message": "Rad 75 min locker. HF unter 140.", "notes": ["HF unter 140 halten.", "Trittfrequenz 90 oder höher.", "Keine Segmente. Kein Sprint am Kanal."]}, "2026-09-03": {"sport": "frei", "title": "Ruhetag", "cap": null, "message": "Ruhetag. Kein Sport.", "notes": ["Kein Sport."]}, "2026-09-04": {"sport": "rennrad", "title": "FTP-Test", "cap": null, "message": "FTP-Test Höhenstraße. Vorher 60 g Kohlenhydrate.", "notes": ["10 min locker einrollen.", "20 min am Stück gleichmäßig, Ziel etwa 235 W. Nicht vorne raushauen.", "10 min ausrollen.", "FTP = 95 % deiner 20-Minuten-Leistung.", "Vorher essen: 60 g Kohlenhydrate."]}, "2026-09-05": {"sport": "frei", "title": "Flug nach Hossegor", "cap": null, "message": "Ruhetag. Reise, kein Sport.", "notes": ["Kein Sport."]}, "2026-09-06": {"sport": "lauf", "title": "30 min Waldweg", "cap": 150, "message": "Lauf 30 min Waldweg. HF-Deckel 150.", "notes": ["Weicher Untergrund, das ist der Grund für den Wald.", "Kein tiefer Sand, das ist ein Wadenkiller.", "Kein nasser Strandstreifen, der ist immer schräg."]}, "2026-09-07": {"sport": "schwimmen", "title": "20–30 min locker", "cap": null, "message": "Schwimmen 20–30 min locker, oder frei.", "notes": ["Locker, reine Regeneration. Oder frei.", "Surfen zählt als Einheit — dann sag Bescheid."]}, "2026-09-08": {"sport": "lauf", "title": "35 min Waldweg", "cap": 150, "message": "Lauf 35 min Waldweg. HF-Deckel 150.", "notes": ["Vorher prüfen: Waden und Achilles nach Sonntag frei?", "Wenn nicht: kürzen oder schwimmen."]}, "2026-09-09": {"sport": "kraft", "title": "30 min Ganzkörper", "cap": null, "message": "Kraft 30 min Ganzkörper, ohne Geräte.", "notes": ["Kniebeugen, Ausfallschritte, Liegestütz, Planks, Rudern mit Band.", "Fällt weg, wenn du surfen warst."]}, "2026-09-10": {"sport": "lauf", "title": "40 min Waldweg", "cap": 150, "message": "Lauf 40 min Waldweg. HF-Deckel 150.", "notes": ["Gleicher Deckel. Tempo egal."]}, "2026-09-11": {"sport": "frei", "title": "Ruhetag", "cap": null, "message": "Ruhetag. Frei oder Küstenspaziergang.", "notes": ["Frei oder langer lockerer Küstenspaziergang."]}, "2026-09-12": {"sport": "lauf", "title": "45 min flach", "cap": 150, "message": "Lauf 45 min flach. HF-Deckel 150.", "notes": ["Längster Lauf der Woche.", "Schwere Beine? Dann 30 min oder stattdessen schwimmen."]}};
const SPORTS = {lauf:'Laufen',rennrad:'Rennrad',mtb:'Mountainbike',wandern:'Wandern',
  surfen:'Surfen',schwimmen:'Schwimmen',kraft:'Kraft',frei:'Ruhetag'};
const DOW = ['Mo','Di','Mi','Do','Fr','Sa','So'];
const MON = ['Jänner','Februar','März','April','Mai','Juni','Juli','August',
  'September','Oktober','November','Dezember'];

let PLAN = FALLBACK, done = {}, view = 'month', cursor = new Date(), selected = null;
try { done = JSON.parse(localStorage.getItem('trainingDone') || '{}'); } catch(e) {}
const saveDone = () => { try { localStorage.setItem('trainingDone', JSON.stringify(done)); } catch(e) {} };

const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today = iso(new Date());
const mondayOf = d => { const x=new Date(d); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; };
const ico = s => '<svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-'
  + (SPORTS[s] ? s : 'frei') + '" width="24" height="24"></use></svg>';

function bodyHTML(k, p){
  return '<div class="body">'
    + (p.cap ? '<div class="capline"><b>'+p.cap+'</b><span>Herzfrequenz nicht überschreiten</span></div>' : '')
    + '<ul>'+p.notes.map(n=>'<li>'+n+'</li>').join('')+'</ul>'
    + '<label><input type="checkbox" data-k="'+k+'"'+(done[k]?' checked':'')+'> erledigt</label></div>';
}
function wireTicks(root){
  root.querySelectorAll('input[type=checkbox]').forEach(cb => {
    cb.addEventListener('click', e => e.stopPropagation());
    cb.addEventListener('change', e => { done[e.target.dataset.k] = e.target.checked; saveDone(); draw(); });
  });
}

function renderMonth(){
  const y = cursor.getFullYear(), m = cursor.getMonth();
  document.getElementById('label').textContent = MON[m]+' '+y;
  const start = mondayOf(new Date(y, m, 1));
  const g = document.getElementById('grid'); g.innerHTML = '';
  for (let i=0;i<42;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    const k = iso(d), p = PLAN[k];
    const b = document.createElement(p ? 'button' : 'div');
    b.className = 'cell'+(p?' has':'')+(d.getMonth()!==m?' out':'')
      +(k===today?' today':'')+(k===selected?' sel':'')+(done[k]?' done':'');
    b.innerHTML = '<span class="n">'+d.getDate()+'</span>'
      + (p ? ico(p.sport) + (p.cap?'<span class="dot"></span>':'') : '');
    if (p) b.addEventListener('click', () => { selected = (selected===k?null:k); draw(); });
    g.appendChild(b);
  }
  const box = document.getElementById('mdetail');
  const p = selected && PLAN[selected];
  if (!p) { box.innerHTML = '<p class="hint">Tag antippen für die Details.</p>'; return; }
  const d = new Date(selected+'T12:00:00');
  box.innerHTML = '<div class="item sel"><div class="head">'+ico(p.sport)
    + '<div><h3>'+p.title+'</h3><div class="day">'+DOW[(d.getDay()+6)%7]+', '+d.getDate()+'. '
    + MON[d.getMonth()]+' · '+(SPORTS[p.sport]||'')+'</div></div></div>'
    + bodyHTML(selected, p) + '</div>';
  wireTicks(box);
}

function renderWeek(){
  const start = mondayOf(cursor), end = new Date(start);
  end.setDate(start.getDate()+6);
  document.getElementById('label').textContent =
    start.getDate()+'.'+(start.getMonth()+1)+'. – '+end.getDate()+'.'+(end.getMonth()+1)+'.';
  const w = document.getElementById('weeklist'); w.innerHTML = '';
  for (let i=0;i<7;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    const k = iso(d), p = PLAN[k];
    const it = document.createElement('div');
    it.className = 'item'+(p?'':' empty')+(k===today?' today':'')
      +(k===selected?' sel':'')+(done[k]?' done':'');
    it.innerHTML = '<'+(p?'button':'div')+' class="row">'
      + '<div class="dt"><small>'+DOW[i]+'</small><strong>'+d.getDate()+'</strong></div>'
      + (p ? ico(p.sport)
           + '<div><div class="ti">'+p.title+'</div><div class="sp">'+(SPORTS[p.sport]||'')+'</div></div>'
           + (p.cap ? '<div class="hr"><span class="v">'+p.cap+'</span><span class="l">max HF</span></div>' : '<div></div>')
         : '<div></div><div class="sp">nichts geplant</div><div></div>')
      + '</'+(p?'button':'div')+'>'
      + (p && k===selected ? bodyHTML(k, p) : '');
    if (p) it.querySelector('.row').addEventListener('click', () => {
      selected = (selected===k?null:k); draw();
    });
    w.appendChild(it);
  }
  wireTicks(w);
}

function renderToday(){
  const p = PLAN[today], d = new Date();
  const ds = DOW[(d.getDay()+6)%7]+', '+d.getDate()+'. '+MON[d.getMonth()];
  document.getElementById('tIc').innerHTML = ico(p ? p.sport : 'frei');
  document.getElementById('tTx').innerHTML = p
    ? '<b>'+p.title+'</b>'+ds+(p.cap ? ' · HF-Deckel '+p.cap : '')
    : '<b>Nichts geplant</b>'+ds;
}

function draw(){
  document.getElementById('monthView').hidden = view!=='month';
  document.getElementById('weekView').hidden = view!=='week';
  document.getElementById('bM').setAttribute('aria-pressed', view==='month');
  document.getElementById('bW').setAttribute('aria-pressed', view==='week');
  view==='month' ? renderMonth() : renderWeek();
}

function jump(){
  const keys = Object.keys(PLAN).sort();
  if (!keys.length) return;
  if (today >= keys[0] && today <= keys[keys.length-1]) {
    cursor = new Date(today+'T12:00:00');
    if (PLAN[today]) selected = today;
  } else cursor = new Date(keys[0]+'T12:00:00');
}

document.getElementById('prev').addEventListener('click', () => {
  view==='month' ? cursor.setMonth(cursor.getMonth()-1) : cursor.setDate(cursor.getDate()-7); draw(); });
document.getElementById('next').addEventListener('click', () => {
  view==='month' ? cursor.setMonth(cursor.getMonth()+1) : cursor.setDate(cursor.getDate()+7); draw(); });
document.getElementById('bM').addEventListener('click', () => { view='month'; draw(); });
document.getElementById('bW').addEventListener('click', () => { view='week'; draw(); });

fetch('plan.json', {cache:'no-store'})
  .then(r => r.ok ? r.json() : Promise.reject())
  .then(j => { PLAN = j; jump(); renderToday(); draw(); })
  .catch(() => {});

jump(); renderToday(); draw();
</script>
</body>
</html>
